name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: resolve CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image
        run: |
          BASE="ghcr.io/ericjgoossen/atropos-ci"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TAG="$BASE:pr-${{ github.event.pull_request.number }}"
            if docker manifest inspect "$PR_TAG" > /dev/null 2>&1; then
              echo "image=$PR_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "No PR image found at $PR_TAG, falling back to :latest"
              echo "image=$BASE:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "image=$BASE:latest" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: clang-format
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting (main/, components/)
        run: ./scripts/check-format.sh

  build:
    name: idf build
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build

      # compile_commands.json is produced by the build above and is what
      # the tidy jobs need; share it instead of rebuilding in each one.
      # config/sdkconfig.h is generated by the same build and #included by
      # the IDF headers, so the tidy jobs can't parse anything without it.
      # Both paths sit under build/, so the artifact keeps that layout.
      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: |
            build/compile_commands.json
            build/config/sdkconfig.h

  tidy:
    name: clang-tidy
    needs: [setup, build]
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: compile-commands
          path: build

      # check-tidy.sh also lints tests/*.cpp, via its own (separate,
      # host-native) compile database -- see tests/CMakeLists.txt and
      # scripts/check-tidy.sh. A configure-only step is enough; clang-tidy
      # just needs compile_commands.json, not a built binary.
      - name: Configure tests/ (for its compile_commands.json)
        run: cmake -S tests -B build-tests -G Ninja

      - name: Check clang-tidy (main/, components/, tests/)
        run: ./scripts/check-tidy.sh build

  tidy-analyzer:
    name: clang-tidy (analyzer)
    needs: [setup, build]
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: compile-commands
          path: build

      - name: Configure tests/ (for its compile_commands.json)
        run: cmake -S tests -B build-tests -G Ninja

      - name: Check clang-analyzer checks (main/, components/, tests/)
        run: ./scripts/check-tidy-analyzer.sh build

  host-tests:
    name: control_math unit tests (host)
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S tests -B build-tests -G Ninja

      - name: Build
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  coverage:
    name: control_math line coverage (host)
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # Threshold is 0 (report-only) until the real test suite exists --
      # scripts/check-coverage.sh's own default is 80. Raise this as
      # tests/ grows past the current smoke tests; see README.md.
      - name: Check coverage
        run: ./scripts/check-coverage.sh 0
